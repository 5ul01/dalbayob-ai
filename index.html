<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dalbayob AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
  box-sizing: border-box;
}

:root {
  --bg: #080811;
  --panel: rgba(12, 13, 25, .72);
  --panel2: rgba(20, 21, 38, .76);
  --border: rgba(255,255,255,.09);
  --text: #f7f7fb;
  --muted: #9295aa;
  --accent: #a978ff;
  --accent2: #ff76c8;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Inter, Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 75% 35%, rgba(167, 91, 255, .18), transparent 30%),
    radial-gradient(circle at 90% 80%, rgba(255, 80, 190, .12), transparent 30%),
    var(--bg);
}

/* ================= BACKGROUND ================= */

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.grid {
  position: absolute;
  inset: 0;
  opacity: .08;
  background-image:
    linear-gradient(rgba(255,255,255,.25) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px);
  background-size: 55px 55px;
  transform: perspective(500px) rotateX(55deg) scale(1.5);
  transform-origin: bottom;
}

/* neon moon */

.moon {
  position: absolute;
  width: 270px;
  height: 270px;
  border-radius: 50%;
  right: 17%;
  top: 12%;
  background: radial-gradient(circle at 35% 30%, #f3eaff, #c38aff 45%, #7936bb);
  box-shadow:
    0 0 45px rgba(174,105,255,.55),
    0 0 120px rgba(174,105,255,.25);
  opacity: .32;
}

/* ================= ANIME GIRL ================= */

.character {
  position: absolute;
  right: 3%;
  bottom: -30px;
  width: 520px;
  height: 820px;
  filter:
    drop-shadow(0 0 25px rgba(174,105,255,.25))
    drop-shadow(0 25px 50px rgba(0,0,0,.7));
  opacity: .88;
}

/* hair */

.hair {
  position: absolute;
  width: 300px;
  height: 390px;
  right: 110px;
  top: 80px;
  background: linear-gradient(145deg, #39265d, #17152b 65%, #090912);
  border-radius: 48% 48% 42% 45%;
  transform: rotate(4deg);
  box-shadow: inset -30px -20px 50px rgba(0,0,0,.5);
}

.hair:before,
.hair:after {
  content: "";
  position: absolute;
  background: inherit;
  width: 130px;
  height: 310px;
  top: 150px;
  border-radius: 50%;
}

.hair:before {
  left: -48px;
  transform: rotate(18deg);
}

.hair:after {
  right: -35px;
  transform: rotate(-16deg);
}

/* ears */

.ear {
  position: absolute;
  width: 105px;
  height: 145px;
  top: 45px;
  background: #2d1e49;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  z-index: 2;
}

.ear.left {
  left: 125px;
  transform: rotate(-20deg);
}

.ear.right {
  right: 105px;
  transform: rotate(20deg);
}

.ear:after {
  content: "";
  position: absolute;
  inset: 20px 25px 20px;
  background: #bd6aaf;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  opacity: .55;
}

/* face */

.face {
  position: absolute;
  width: 245px;
  height: 285px;
  right: 140px;
  top: 145px;
  background: linear-gradient(145deg, #f8d5c9, #eab4b7);
  border-radius: 46% 46% 48% 48%;
  z-index: 3;
  box-shadow: inset -15px -10px 30px rgba(130,60,100,.15);
}

/* fringe */

.fringe {
  position: absolute;
  z-index: 5;
  width: 250px;
  height: 120px;
  right: 137px;
  top: 135px;
  background: #312047;
  clip-path: polygon(
    0 0, 100% 0, 90% 65%,
    72% 30%, 62% 95%,
    47% 40%, 30% 88%,
    22% 35%, 5% 70%
  );
}

/* eyes */

.eye {
  position: absolute;
  z-index: 6;
  width: 52px;
  height: 70px;
  top: 255px;
  background: #fff;
  border-radius: 50%;
  overflow: hidden;
}

.eye.left {
  right: 275px;
}

.eye.right {
  right: 165px;
}

.eye:after {
  content: "";
  position: absolute;
  width: 30px;
  height: 42px;
  left: 11px;
  bottom: 5px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 30%, #fff 0 4px, transparent 5px),
    linear-gradient(#8c55dc, #321d67);
}

.eye:before {
  content: "";
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: white;
  z-index: 2;
  top: 34px;
  left: 22px;
}

/* nose + mouth */

.nose {
  position: absolute;
  z-index: 6;
  right: 228px;
  top: 325px;
  width: 8px;
  height: 12px;
  border-left: 2px solid rgba(120,70,90,.4);
  transform: rotate(-20deg);
}

.mouth {
  position: absolute;
  z-index: 6;
  right: 205px;
  top: 350px;
  width: 35px;
  height: 16px;
  border-bottom: 3px solid #9c5274;
  border-radius: 0 0 50% 50%;
}

/* body */

.neck {
  position: absolute;
  z-index: 2;
  right: 220px;
  top: 405px;
  width: 80px;
  height: 100px;
  background: #eab9b5;
}

.body {
  position: absolute;
  right: 85px;
  top: 450px;
  width: 340px;
  height: 390px;
  border-radius: 48% 48% 20% 20%;
  background:
    linear-gradient(130deg, #24183a, #101020 70%);
  box-shadow: inset 20px 0 50px rgba(184,99,255,.13);
}

/* clothing */

.collar {
  position: absolute;
  z-index: 4;
  right: 185px;
  top: 435px;
  width: 150px;
  height: 105px;
  border-left: 8px solid #e7d9f7;
  border-right: 8px solid #e7d9f7;
  transform: rotate(45deg);
  opacity: .8;
}

.ribbon {
  position: absolute;
  z-index: 5;
  right: 220px;
  top: 505px;
  width: 70px;
  height: 80px;
  background: linear-gradient(135deg, #ff75c8, #8e55ff);
  clip-path: polygon(50% 0, 100% 30%, 72% 100%, 50% 65%, 28% 100%, 0 30%);
}

/* tail */

.tail {
  position: absolute;
  z-index: 0;
  right: -15px;
  bottom: 100px;
  width: 230px;
  height: 470px;
  border: 55px solid #3c2759;
  border-left-color: transparent;
  border-radius: 50%;
  transform: rotate(-25deg);
  opacity: .7;
}

/* ================= APP ================= */

.app {
  position: relative;
  z-index: 10;
  display: flex;
  width: 100%;
  height: 100%;
}

/* SIDEBAR */

.sidebar {
  width: 255px;
  flex-shrink: 0;
  padding: 18px;
  background: rgba(7,8,17,.74);
  backdrop-filter: blur(25px);
  border-right: 1px solid var(--border);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 20px;
  margin-bottom: 25px;
}

.logo-icon {
  width: 37px;
  height: 37px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #9a63ff, #ff70c8);
  box-shadow: 0 0 25px rgba(161,93,255,.35);
}

.new-chat {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: white;
  background: rgba(255,255,255,.055);
  cursor: pointer;
  text-align: left;
  font-size: 14px;
}

.new-chat:hover {
  background: rgba(255,255,255,.1);
}

.section {
  margin-top: 30px;
  color: #777b91;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.3px;
}

/* MAIN */

.main {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 65px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 0 25px;
  background: rgba(7,8,17,.45);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}

.header-name {
  font-size: 15px;
  font-weight: 700;
}

.online {
  margin-left: 12px;
  color: #72e8aa;
  font-size: 12px;
}

.online:before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #72e8aa;
  box-shadow: 0 0 10px #72e8aa;
  margin-right: 6px;
}

/* CHAT */

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 40px 20px 145px;
}

.chat-inner {
  width: min(850px, 100%);
  margin: auto;
}

.welcome {
  margin-top: 12vh;
  text-align: center;
}

.welcome h1 {
  font-size: 37px;
  margin: 0 0 10px;
  letter-spacing: -1.5px;
}

.welcome p {
  color: var(--muted);
  margin: 0;
}

.spark {
  display: inline-grid;
  place-items: center;
  width: 62px;
  height: 62px;
  border-radius: 20px;
  margin-bottom: 20px;
  font-size: 28px;
  background: linear-gradient(
    135deg,
    rgba(157,92,255,.25),
    rgba(255,91,195,.18)
  );
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 0 40px rgba(155,91,255,.15);
}

/* MESSAGES */

.message-row {
  display: flex;
  margin: 22px 0;
  animation: slide .22s ease;
}

@keyframes slide {
  from {
    opacity: 0;
    transform: translateY(7px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message-row.user {
  justify-content: flex-end;
}

.message {
  max-width: 78%;
  padding: 14px 17px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.65;
  white-space: pre-wrap;
}

.message.user {
  background: linear-gradient(
    135deg,
    rgba(142,84,230,.48),
    rgba(203,79,166,.32)
  );
  border: 1px solid rgba(255,255,255,.1);
}

.message.assistant {
  background: rgba(10,11,22,.72);
  border: 1px solid var(--border);
  backdrop-filter: blur(15px);
}

/* COMPOSER */

.composer-area {
  position: absolute;
  z-index: 20;
  bottom: 0;
  left: 255px;
  right: 0;
  padding: 20px;
  background: linear-gradient(
    transparent,
    rgba(7,8,17,.9) 45%
  );
}

.composer {
  width: min(850px, 100%);
  margin: auto;
  display: flex;
  align-items: flex-end;
  gap: 7px;
  padding: 8px;
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 19px;
  background: rgba(11,12,24,.82);
  backdrop-filter: blur(25px);
  box-shadow:
    0 15px 50px rgba(0,0,0,.35),
    0 0 40px rgba(130,75,255,.05);
}

textarea {
  flex: 1;
  min-height: 48px;
  max-height: 150px;
  resize: none;
  border: 0;
  outline: 0;
  padding: 13px 8px;
  color: white;
  background: transparent;
  font: inherit;
}

textarea::placeholder {
  color: #686c80;
}

.tool {
  width: 43px;
  height: 43px;
  border: 0;
  border-radius: 13px;
  background: rgba(255,255,255,.055);
  color: #bbbfd0;
  cursor: pointer;
  font-size: 17px;
}

.tool:hover {
  background: rgba(255,255,255,.11);
  color: white;
}

.send {
  color: #111;
  background: white;
  font-size: 20px;
  font-weight: 700;
}

.send:hover {
  background: #e8e8e8;
}

.note {
  width: min(850px, 100%);
  margin: 8px auto 0;
  text-align: center;
  color: #555a70;
  font-size: 10px;
}

/* MOBILE */

@media(max-width: 700px) {
  .sidebar {
    display: none;
  }

  .composer-area {
    left: 0;
  }

  .character {
    right: -190px;
    opacity: .22;
    transform: scale(.85);
    transform-origin: bottom right;
  }

  .moon {
    right: -50px;
  }

  .welcome h1 {
    font-size: 28px;
  }

  .message {
    max-width: 90%;
  }
}
</style>

</head>

<body>

<div class="background">
  <div class="grid"></div>
  <div class="moon"></div>

  <div class="character">
    <div class="tail"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="hair"></div>
    <div class="face"></div>
    <div class="fringe"></div>
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="nose"></div>
    <div class="mouth"></div>
    <div class="neck"></div>
    <div class="body"></div>
    <div class="collar"></div>
    <div class="ribbon"></div>
  </div>
</div>

<div class="app">

  <aside class="sidebar">

```
<div class="logo">
  <div class="logo-icon">✦</div>
  Dalbayob AI
</div>

<button class="new-chat" onclick="newChat()">
  ＋ &nbsp; New conversation
</button>

<div class="section">
  Conversations
</div>
```

  </aside>

  <main class="main">

```
<header class="header">
  <div class="header-name">Dalbayob AI</div>
  <div class="online">Online</div>
</header>

<section id="chat">
  <div class="chat-inner" id="chat-inner">

    <div class="welcome" id="welcome">
      <div class="spark">✦</div>
      <h1>What are we doing today?</h1>
      <p>Ask Dalbayob AI anything.</p>
    </div>

  </div>
</section>

<div class="composer-area">

  <div class="composer">

    <button class="tool" title="Attach file">
      ＋
    </button>

    <textarea
      id="input"
      rows="1"
      placeholder="Message Dalbayob AI..."
    ></textarea>

    <button class="tool" title="Generate image">
      ◈
    </button>

    <button
      class="tool send"
      onclick="sendMessage()"
      title="Send"
    >
      ↑
    </button>

  </div>

  <div class="note">
    Dalbayob AI may make mistakes. Check important information.
  </div>

</div>
```

  </main>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const chatInner = document.getElementById("chat-inner");

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height =
    Math.min(input.scrollHeight, 150) + "px";
});

input.addEventListener("keydown", event => {

  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }

});

function addMessage(text, type) {

  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.style.display = "none";
  }

  const row = document.createElement("div");
  row.className = "message-row " + type;

  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;

  row.appendChild(message);
  chatInner.appendChild(row);

  chat.scrollTop = chat.scrollHeight;

  return message;
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";
  input.style.height = "auto";

  const reply = addMessage("Thinking...", "assistant");

  try {

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "AI request failed."
      );
    }

    reply.textContent = data.reply;

  } catch (error) {

    reply.textContent =
      "⚠️ " + error.message;

  }
}

function newChat() {

  chatInner.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="spark">✦</div>
      <h1>What are we doing today?</h1>
      <p>Ask Dalbayob AI anything.</p>
    </div>
  `;

}

</script>

</body>
</html>
