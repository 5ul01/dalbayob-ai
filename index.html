<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dalbayob AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
    --black: #050604;
    --black2: #090d08;
    --green: #102719;
    --green2: #193722;
    --green3: #284b31;
    --gold: #cda957;
    --gold-light: #f0d78c;
    --cream: #eee8d6;
    --muted: #858b7e;
    --roach-brown: #5b301b;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    font-family: Inter, sans-serif;
    color: var(--cream);

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(39, 86, 48, .24),
            transparent 42%
        ),
        radial-gradient(
            circle at 15% 90%,
            rgba(205, 169, 87, .08),
            transparent 30%
        ),
        var(--black);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .16;

    background-image:
        linear-gradient(
            30deg,
            rgba(205,169,87,.15) 1px,
            transparent 1px
        ),
        linear-gradient(
            150deg,
            rgba(205,169,87,.15) 1px,
            transparent 1px
        );

    background-size: 72px 72px;
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    box-shadow:
        inset 0 0 180px rgba(0,0,0,.9);

    z-index: 9999;
}

/* =========================================================
   REAL COCKROACHES
========================================================= */

.real-roach {
    position: fixed;

    width: 190px;
    height: 190px;

    pointer-events: none;
    z-index: 50;

    filter:
        drop-shadow(0 18px 15px rgba(0,0,0,.78))
        saturate(1.08)
        contrast(1.05);
}

.real-roach img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
}

.rr1 {
    left: -240px;
    top: 8%;

    width: 210px;
    height: 210px;

    animation: crawlAcross 25s linear infinite;
}

.rr2 {
    right: -250px;
    top: 30%;

    width: 235px;
    height: 235px;

    transform: scaleX(-1);

    animation: crawlReverse 30s linear infinite;
}

.rr3 {
    left: 12%;
    top: -230px;

    width: 180px;
    height: 180px;

    transform: rotate(82deg);

    animation: crawlDown 22s linear infinite;
}

.rr4 {
    right: 4%;
    bottom: -280px;

    width: 270px;
    height: 270px;

    transform: rotate(-58deg);

    animation: crawlUp 27s linear infinite;
}

.rr5 {
    left: -180px;
    top: 75%;

    width: 150px;
    height: 150px;

    animation: crawlFast 18s linear infinite;
}

.rr6 {
    right: -230px;
    top: 11%;

    width: 220px;
    height: 220px;

    transform: rotate(180deg);

    animation: crawlHeader 34s linear infinite;
}

.rr7 {
    left: 53%;
    top: -210px;

    width: 165px;
    height: 165px;

    transform: rotate(110deg);

    animation: crawlDrop 36s linear infinite;
}

.rr8 {
    left: -210px;
    top: 45%;

    width: 175px;
    height: 175px;

    animation: crawlSide 39s linear infinite;
}

/* =========================================================
   ROACH ANIMATIONS
========================================================= */

@keyframes crawlAcross {

    0% {
        left: -250px;
        top: 8%;
        transform: rotate(-10deg);
    }

    20% {
        top: 13%;
        transform: rotate(5deg);
    }

    40% {
        top: 6%;
        transform: rotate(-4deg);
    }

    60% {
        top: 15%;
        transform: rotate(7deg);
    }

    80% {
        top: 8%;
    }

    100% {
        left: calc(100% + 250px);
        top: 12%;
        transform: rotate(-10deg);
    }
}

@keyframes crawlReverse {

    0% {
        right: -260px;
        top: 30%;
        transform: scaleX(-1) rotate(-12deg);
    }

    25% {
        top: 24%;
    }

    50% {
        top: 35%;
    }

    75% {
        top: 27%;
    }

    100% {
        right: calc(100% + 260px);
        top: 32%;
        transform: scaleX(-1) rotate(-12deg);
    }
}

@keyframes crawlDown {

    0% {
        top: -230px;
        left: 12%;
    }

    25% {
        left: 17%;
    }

    50% {
        left: 10%;
    }

    75% {
        left: 15%;
    }

    100% {
        top: calc(100% + 230px);
        left: 8%;
    }
}

@keyframes crawlUp {

    0% {
        bottom: -290px;
        right: 4%;
    }

    25% {
        right: 10%;
    }

    50% {
        right: 3%;
    }

    75% {
        right: 13%;
    }

    100% {
        bottom: calc(100% + 290px);
        right: 7%;
    }
}

@keyframes crawlFast {

    0% {
        left: -190px;
        top: 75%;
    }

    20% {
        top: 69%;
    }

    40% {
        top: 79%;
    }

    60% {
        top: 71%;
    }

    80% {
        top: 78%;
    }

    100% {
        left: calc(100% + 190px);
        top: 73%;
    }
}

@keyframes crawlHeader {

    0% {
        right: -240px;
        top: 11%;
        transform: rotate(180deg);
    }

    25% {
        top: 17%;
    }

    50% {
        top: 8%;
    }

    75% {
        top: 15%;
    }

    100% {
        right: calc(100% + 240px);
        top: 11%;
        transform: rotate(180deg);
    }
}

@keyframes crawlDrop {

    0% {
        top: -220px;
        left: 53%;
    }

    30% {
        left: 59%;
    }

    65% {
        left: 48%;
    }

    100% {
        top: calc(100% + 220px);
        left: 54%;
    }
}

@keyframes crawlSide {

    0% {
        left: -220px;
        top: 45%;
    }

    30% {
        top: 39%;
    }

    60% {
        top: 51%;
    }

    100% {
        left: calc(100% + 220px);
        top: 44%;
    }
}

/* =========================================================
   APP
========================================================= */

.app {
    position: relative;
    z-index: 100;

    display: flex;

    width: 100%;
    height: 100vh;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    position: relative;
    z-index: 300;

    width: 86px;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 20px 0;

    background: rgba(5,8,5,.9);

    border-right:
        1px solid rgba(205,169,87,.18);

    backdrop-filter: blur(20px);
}

.brand-mark {
    width: 50px;
    height: 50px;

    display: grid;
    place-items: center;

    border-radius: 16px;

    border:
        1px solid rgba(205,169,87,.5);

    color: var(--gold-light);

    font-size: 25px;

    box-shadow:
        0 0 30px rgba(205,169,87,.08);

    margin-bottom: 45px;
}

/* =========================================================
   NAV
========================================================= */

.nav {
    display: flex;
    flex-direction: column;

    gap: 15px;
}

.nav button {
    width: 48px;
    height: 48px;

    border-radius: 14px;

    border:
        1px solid rgba(205,169,87,.14);

    background:
        rgba(255,255,255,.025);

    color: #8d927f;

    font-size: 20px;

    cursor: pointer;

    transition:
        transform .2s,
        color .2s,
        border-color .2s,
        background .2s;
}

.nav button:hover,
.nav button.active {
    color: var(--gold-light);

    border-color:
        rgba(205,169,87,.5);

    background:
        rgba(205,169,87,.08);

    transform:
        translateY(-2px);
}

.sidebar-bottom {
    margin-top: auto;

    writing-mode: vertical-rl;

    color: #555c51;

    font-size: 9px;

    letter-spacing: 4px;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    position: relative;

    flex: 1;

    min-width: 0;

    display: flex;
    flex-direction: column;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: relative;
    z-index: 300;

    height: 78px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 32px;

    background:
        rgba(4,7,4,.78);

    border-bottom:
        1px solid rgba(205,169,87,.12);

    backdrop-filter: blur(20px);
}

.header-left {
    display: flex;
    align-items: center;

    gap: 14px;
}

.header-symbol {
    color: var(--gold-light);
    font-size: 25px;
}

.header-title {
    font-family: Cinzel, serif;

    font-size: 16px;

    letter-spacing: 4px;
}

.header-sub {
    margin-top: 3px;

    color: #666d61;

    font-size: 9px;

    letter-spacing: 2px;
}

.status {
    display: flex;
    align-items: center;

    gap: 9px;

    color: #7f8979;

    font-size: 9px;

    letter-spacing: 2px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #a8c174;

    box-shadow:
        0 0 12px #a8c174;
}

/* =========================================================
   CHAT
========================================================= */

#chat {
    position: relative;
    z-index: 120;

    flex: 1;

    overflow-y: auto;

    scrollbar-width: thin;

    scrollbar-color:
        #354332
        transparent;
}

.chat-inner {
    width: min(1050px, 100%);

    min-height: 100%;

    margin: auto;

    padding: 50px 35px 190px;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome {
    min-height: 60vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.welcome-emblem {
    width: 105px;
    height: 105px;

    display: grid;
    place-items: center;

    margin-bottom: 25px;

    border-radius: 50%;

    border:
        1px solid rgba(205,169,87,.42);

    background:
        radial-gradient(
            circle,
            rgba(205,169,87,.1),
            transparent 68%
        );

    box-shadow:
        0 0 60px rgba(205,169,87,.07),
        inset 0 0 30px rgba(205,169,87,.04);
}

.crescent {
    color: var(--gold-light);
    font-size: 50px;
}

.welcome h1 {
    margin: 0;

    font-family: Cinzel, serif;

    font-size:
        clamp(28px, 4vw, 48px);

    font-weight: 600;

    letter-spacing: 1px;
}

.welcome > p {
    margin-top: 12px;

    color: #858b7e;

    font-size: 14px;
}

/* =========================================================
   SPECIMEN IMAGE
========================================================= */

.roach-gallery {
    position: relative;

    width: min(390px, 90%);

    margin: 25px auto 5px;
}

.roach-gallery::before {
    content: "SPECIMEN // 001";

    position: absolute;

    left: 17px;
    top: -12px;

    z-index: 5;

    padding: 4px 8px;

    color: var(--gold-light);

    background: var(--black);

    font-size: 8px;

    letter-spacing: 3px;
}

.roach-gallery img {
    width: 100%;

    display: block;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    border-radius: 20px;

    border:
        1px solid rgba(205,169,87,.35);

    box-shadow:
        0 20px 70px rgba(0,0,0,.7),
        0 0 35px rgba(205,169,87,.07);

    filter:
        saturate(.88)
        contrast(1.06);
}

.roach-gallery-caption {
    position: absolute;

    left: 14px;
    right: 14px;
    bottom: 14px;

    padding: 12px 14px;

    border-radius: 12px;

    background:
        rgba(3,5,3,.82);

    border:
        1px solid rgba(205,169,87,.18);

    backdrop-filter: blur(12px);

    color: #b9b5a1;

    text-align: left;

    font-size: 9px;

    letter-spacing: 2px;
}

/* =========================================================
   SUGGESTIONS
========================================================= */

.suggestions {
    display: flex;
    flex-wrap: wrap;

    justify-content: center;

    gap: 9px;

    max-width: 700px;

    margin-top: 27px;
}

.suggestion {
    padding: 10px 16px;

    border-radius: 100px;

    border:
        1px solid rgba(205,169,87,.16);

    background:
        rgba(255,255,255,.025);

    color: #aaa99a;

    font-family: Inter, sans-serif;

    font-size: 11px;

    cursor: pointer;

    transition: .2s;
}

.suggestion:hover {
    color: var(--gold-light);

    border-color:
        rgba(205,169,87,.45);

    background:
        rgba(205,169,87,.07);

    transform:
        translateY(-1px);
}

/* =========================================================
   MESSAGES
========================================================= */

.message-row {
    display: flex;

    margin: 22px 0;
}

.message-row.user {
    justify-content: flex-end;
}

.message {
    max-width: 78%;

    padding: 15px 18px;

    border-radius: 17px;

    line-height: 1.65;

    font-size: 14px;

    white-space: pre-wrap;
}

.message.user {
    color: #e7eadc;

    background:
        linear-gradient(
            135deg,
            #183522,
            #102417
        );

    border:
        1px solid rgba(111,160,110,.18);

    border-bottom-right-radius: 5px;
}

.message.assistant {
    color: #d3d2c5;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid rgba(205,169,87,.12);

    border-left:
        2px solid rgba(205,169,87,.6);

    border-bottom-left-radius: 5px;
}

.message.assistant img,
.message.user img {
    max-width: 100%;

    display: block;

    border-radius: 14px;

    border:
        1px solid rgba(205,169,87,.3);
}

/* =========================================================
   IMAGE ATTACHMENT PREVIEW
========================================================= */

.attachment-preview {
    position: absolute;

    left: 50%;

    bottom: 88px;

    transform:
        translateX(-50%);

    width: min(900px, calc(100% - 56px));

    display: none;

    padding: 9px;

    border-radius: 16px;

    border:
        1px solid rgba(205,169,87,.22);

    background:
        rgba(8,12,8,.94);

    backdrop-filter: blur(22px);

    box-shadow:
        0 20px 50px rgba(0,0,0,.55);
}

.attachment-preview.visible {
    display: flex;

    align-items: center;

    gap: 12px;
}

.attachment-preview img {
    width: 58px;
    height: 58px;

    object-fit: cover;

    border-radius: 11px;

    border:
        1px solid rgba(205,169,87,.3);
}

.attachment-info {
    flex: 1;

    min-width: 0;
}

.attachment-title {
    color: var(--gold-light);

    font-size: 11px;

    letter-spacing: 1px;
}

.attachment-sub {
    margin-top: 4px;

    color: #72796d;

    font-size: 9px;
}

.attachment-remove {
    width: 34px;
    height: 34px;

    border-radius: 10px;

    border:
        1px solid rgba(205,169,87,.15);

    background:
        rgba(255,255,255,.025);

    color: #8d927f;

    cursor: pointer;

    font-size: 16px;

    transition: .2s;
}

.attachment-remove:hover {
    color: var(--gold-light);

    border-color:
        rgba(205,169,87,.45);

    background:
        rgba(205,169,87,.07);
}

/* =========================================================
   ATTACHED IMAGE IN CHAT
========================================================= */

.chat-image-preview {
    max-width: 260px;

    margin-top: 10px;

    border-radius: 13px;

    border:
        1px solid rgba(205,169,87,.25);

    box-shadow:
        0 10px 35px rgba(0,0,0,.35);
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 400;

    padding:
        20px 28px 23px;

    background:
        linear-gradient(
            to top,
            rgba(5,6,4,1) 40%,
            rgba(5,6,4,.88),
            transparent
        );
}

.composer {
    position: relative;

    width: min(900px, 100%);

    min-height: 62px;

    margin: auto;

    display: flex;
    align-items: flex-end;

    gap: 9px;

    padding: 8px;

    border-radius: 19px;

    border:
        1px solid rgba(205,169,87,.18);

    background:
        rgba(11,16,11,.92);

    backdrop-filter: blur(22px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.5),
        inset 0 0 25px rgba(205,169,87,.015);
}

.tool {
    width: 46px;
    height: 46px;

    flex: 0 0 46px;

    border-radius: 13px;

    border:
        1px solid rgba(205,169,87,.13);

    background:
        rgba(255,255,255,.025);

    color: #929888;

    font-size: 20px;

    cursor: pointer;

    transition: .2s;
}

.tool:hover {
    color: var(--gold-light);

    border-color:
        rgba(205,169,87,.4);

    background:
        rgba(205,169,87,.06);
}

.tool.image {
    font-size: 21px;
}

.tool.send {
    color: #10130d;

    background: var(--gold);

    border-color: var(--gold);

    font-weight: 800;
}

.tool.send:hover {
    background: var(--gold-light);

    transform:
        translateY(-2px);
}

textarea {
    flex: 1;

    min-height: 46px;
    max-height: 150px;

    padding: 13px 4px;

    resize: none;

    border: 0;
    outline: 0;

    background: transparent;

    color: #eee;

    font-family: Inter, sans-serif;

    font-size: 14px;
}

textarea::placeholder {
    color: #62685e;
}

.note {
    margin-top: 9px;

    color: #555a51;

    text-align: center;

    font-size: 9px;

    letter-spacing: .5px;
}

/* =========================================================
   HIDDEN FILE INPUT
========================================================= */

#imageInput {
    display: none;
}

/* =========================================================
   SCROLLBAR
========================================================= */

#chat::-webkit-scrollbar {
    width: 7px;
}

#chat::-webkit-scrollbar-track {
    background: transparent;
}

#chat::-webkit-scrollbar-thumb {
    background: #263126;

    border-radius: 20px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .sidebar {
        width: 58px;
    }

    .brand-mark {
        width: 40px;
        height: 40px;

        margin-bottom: 25px;

        font-size: 19px;

        border-radius: 12px;
    }

    .nav button {
        width: 38px;
        height: 38px;

        font-size: 17px;
    }

    .header {
        padding: 0 16px;
    }

    .header-sub,
    .status {
        display: none;
    }

    .chat-inner {
        padding:
            30px 16px 165px;
    }

    .message {
        max-width: 90%;
    }

    .composer-area {
        padding: 12px;
    }

    .tool {
        width: 40px;
        height: 40px;

        flex-basis: 40px;
    }

    .composer {
        min-height: 56px;
    }

    .real-roach {
        width: 125px;
        height: 125px;
    }

    .rr2,
    .rr4,
    .rr6,
    .rr8 {
        display: none;
    }

    .roach-gallery {
        width: min(330px, 90%);
    }

    .attachment-preview {
        width: calc(100% - 24px);

        bottom: 76px;
    }
}
</style>
</head>

     REAL COCKROACHES

</div>

</div>


<div class="app">

    <!-- =====================================================

    <aside class="sidebar">

        <div class="nav">

        </div>

                </div>

                <div>

                    <div class="header-title">
                        DALBAYOB AI
                    </div>

                    <div class="header-sub">
                        INTELLIGENCE SYSTEM
                    </div>

                </div>

            </div>


            <div class="status">

                <div class="status-dot"></div>

                SYSTEM ONLINE

            </div>

        </header>


        <!-- CHAT -->

        <section id="chat">

            <div

                        </div>

                    </div>

                    <h1>

                    </h1>

                    <p>

                    </p>


                    <div class="roach-gallery">

                        <img
                            src="https://avatars.fastly.steamstatic.com/b76a2e69616ae68a574fdc638ab82fdcc3f94161_full.jpg"
                            alt="Dalbayob specimen"
                        >

                        <div class="roach-gallery-caption">
                            DALBAYOB SPECIMEN ARCHIVE · ROACH DIVISION
                        </div>

                    </div>


                    <div class="suggestions">

                        <button
                            class="suggestion"
                            type="button"
                            onclick="useSuggestion('What can you do?')">
                            What can you do?
                        </button>

                        <button
                            class="suggestion"
                            type="button"
                            onclick="useSuggestion('Explain something complicated')">
                            Explain something complicated
                        </button>

                        <button
                            class="suggestion"
                            type="button"
                            onclick="useSuggestion('Give me a creative idea')">
                            Give me a creative idea
                        </button>

                        <button
                            class="suggestion"
                            type="button"
                            onclick="useSuggestion('Generate an image of a giant cockroach')">
                            🪳 Summon a roach
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- COMPOSER -->

        <div class="composer-area">

            <!-- ATTACHMENT PREVIEW -->

            <div
                class="attachment-preview"
                id="attachmentPreview">

                <img
                    id="attachmentPreviewImage"
                    src=""
                    alt="Attached image"
                >

                <div class="attachment-info">

                    <div class="attachment-title">
                        IMAGE ATTACHED
                    </div>

                    <div class="attachment-sub">
                        Dalbayob can analyze this image.
                    </div>

                </div>

                <button
                    class="attachment-remove"
                    type="button"
                    title="Remove image"
                    onclick="clearAttachment()">
                    ×
                </button>

            </div>


            <div class="composer">

                <!-- HIDDEN FILE PICKER -->

                <input
                    id="imageInput"
                    type="file"
                    accept="image/*"
                    onchange="handleImageUpload(event)"
                >


                <!-- ATTACH -->

                <button
                    class="tool"
                    title="Attach image"
                    type="button"
                    onclick="openImagePicker()">
                    ✡
                </button>


                <!-- TEXT -->

                <textarea
                    id="input"
                    rows="1"
                    placeholder="Speak to Dalbayob..."></textarea>


                <!-- IMAGE GENERATION -->

                <button
                    class="tool image"
                    title="Generate image"
                    type="button"
                    onclick="generateImage()">
                    ☪
                </button>


                <!-- SEND -->

                <button
                    class="tool send"
                    title="Send"
                    type="button"
                    onclick="sendMessage()">
                    ↑
                </button>

            </div>


            <div class="note">
                Dalbayob AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const input =
    document.getElementById("input");

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chat-inner");

const imageInput =
    document.getElementById("imageInput");

const attachmentPreview =
    document.getElementById("attachmentPreview");

const attachmentPreviewImage =
    document.getElementById("attachmentPreviewImage");


/* =========================================================
   MEMORY
========================================================= */

let conversationHistory = [];


/* =========================================================
   IMAGE MEMORY
========================================================= */

/*
   currentImage
   = latest generated/edited image.

   attachedImage
   = image currently uploaded by the user.

   currentAnalysisImage
   = image Dalbayob should continue
     remembering during image questions.
*/

let currentImage = null;

let attachedImage = null;

let currentAnalysisImage = null;


/* =========================================================
   TEXTAREA AUTO RESIZE
========================================================= */

input.addEventListener("input", () => {

    input.style.height = "auto";

    input.style.height =
        Math.min(input.scrollHeight, 150) + "px";

});


/* =========================================================
   ENTER TO SEND
========================================================= */

input.addEventListener("keydown", event => {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

});


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(text, type) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const row =
        document.createElement("div");

    row.className =
        "message-row " + type;

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    row.appendChild(message);

    chatInner.appendChild(row);

    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight;

    });

    return message;
}


/* =========================================================
   ADD IMAGE MESSAGE
========================================================= */

function addImageMessage(image, text) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const row =
        document.createElement("div");

    row.className =
        "message-row user";

    const message =
        document.createElement("div");

    message.className =
        "message user";

    if (text) {

        const textNode =
            document.createElement("div");

        textNode.textContent =
            text;

        message.appendChild(
            textNode
        );
    }

    const imageElement =
        document.createElement("img");

    imageElement.src =
        image;

    imageElement.alt =
        "Uploaded image";

    imageElement.className =
        "chat-image-preview";

    message.appendChild(
        imageElement
    );

    row.appendChild(
        message
    );

    chatInner.appendChild(
        row
    );

    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight;

    });

    return message;
}


/* =========================================================
   IMAGE UPLOAD
========================================================= */

function openImagePicker() {

    imageInput.click();

}


/* =========================================================
   HANDLE IMAGE UPLOAD
========================================================= */

function handleImageUpload(event) {

    const file =
        event.target.files?.[0];

    if (!file)
        return;


    if (!file.type.startsWith("image/")) {

        alert("Please select an image.");

        return;
    }


    const reader =
        new FileReader();


    reader.onload = () => {

        attachedImage =
            reader.result;

        currentAnalysisImage =
            reader.result;


        attachmentPreviewImage.src =
            attachedImage;

        attachmentPreview.classList.add(
            "visible"
        );


        input.placeholder =
            "Ask Dalbayob about this image...";

        input.focus();

    };


    reader.readAsDataURL(file);

}


/* =========================================================
   CLEAR ATTACHMENT
========================================================= */

function clearAttachment() {

    attachedImage = null;

    currentAnalysisImage = null;

    imageInput.value = "";

    attachmentPreviewImage.src = "";

    attachmentPreview.classList.remove(
        "visible"
    );

    input.placeholder =
        "Speak to Dalbayob...";

}


/* =========================================================
   CHAT
========================================================= */

async function sendMessage() {

    const text =
        input.value.trim();


    /*
       Allow either:

       text

       OR

       image + text

       OR

       image alone
    */

    if (!text && !attachedImage)
        return;


    const imageForThisMessage =
        attachedImage ||
        currentAnalysisImage ||
        null;


    const actualMessage =
        text ||
        "Analyze this image and tell me what you see.";


    /*
       Display user's message.
    */

    if (imageForThisMessage) {

        addImageMessage(
            imageForThisMessage,
            text
        );

    } else {

        addMessage(
            text,
            "user"
        );

    }


    /*
       Clear input.
    */

    input.value = "";

    input.style.height =
        "auto";


    /*
       Hide attachment preview,
       but KEEP the image as the
       active analysis image.

       This allows follow-up questions.

       Example:

       Upload image

       "What's this?"

       "What color is the car?"

       "What model is it?"
    */

    if (imageForThisMessage) {

        currentAnalysisImage =
            imageForThisMessage;

        attachedImage = null;

        imageInput.value = "";

        attachmentPreview.classList.remove(
            "visible"
        );

    }


    /*
       Show thinking.
    */

    const reply =
        addMessage(
            "Thinking...",
            "assistant"
        );


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            actualMessage,

                        history:
                            conversationHistory,

                        image:
                            imageForThisMessage ||
                            currentAnalysisImage ||
                            null

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "AI request failed."
            );

        }


        /*
           Display response.
        */

        reply.textContent =
            data.reply;


        /*
           Save text conversation.

           Do NOT put base64 image data
           inside conversationHistory.
        */

        conversationHistory.push({

            role: "user",

            content:
                imageForThisMessage
                    ? "[Image attached] " + actualMessage
                    : actualMessage

        });


        conversationHistory.push({

            role: "assistant",

            content:
                data.reply

        });


    } catch (error) {

        reply.textContent =
            "⚠️ " + error.message;

    }


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   IMAGE GENERATION + IMAGE EDITING
========================================================= */

async function generateImage() {

    const prompt =
        input.value.trim();


    /*
       If an uploaded image exists,
       allow the image generator to
       edit that image too.
    */

    const sourceImage =
        currentImage ||
        attachedImage ||
        null;


    if (!prompt) {

        input.focus();

        return;

    }


    /*
       Add user's image instruction
       to visible chat.
    */

    addMessage(
        "☪ " + prompt,
        "user"
    );


    input.value = "";

    input.style.height =
        "auto";


    /*
       Decide whether this is:

       new image

       or

       image edit.
    */

    const statusText =
        sourceImage
            ? "✏️ Editing the latest specimen..."
            : "🪳 Generating specimen...";


    const message =
        addMessage(
            statusText,
            "assistant"
        );


    try {

        const response =
            await fetch(
                "/api/image",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        prompt: prompt,

                        image:
                            sourceImage

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Image generation failed."
            );

        }


        /*
           Save newest image.
        */

        currentImage =
            data.image;


        /*
           Remove loading text.
        */

        message.textContent =
            "";


        /*
           Create image.
        */

        const image =
            document.createElement("img");

        image.src =
            currentImage;

        image.alt =
            prompt;

        message.appendChild(
            image
        );


        /*
           Save image interaction
           without storing the actual
           base64 image.
        */

        conversationHistory.push({

            role: "user",

            content:
                "[Image request] " +
                prompt

        });


        conversationHistory.push({

            role: "assistant",

            content:
                "[Generated an image based on the user's request]"

        });


    } catch (error) {

        message.textContent =
            "⚠️ " + error.message;

    }


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat() {

    /*
       Clear conversation.
    */

    conversationHistory = [];


    /*
       Clear image memory.
    */

    currentImage = null;

    attachedImage = null;

    currentAnalysisImage = null;


    /*
       Reset file input.
    */

    imageInput.value = "";


    /*
       Reset attachment UI.
    */

    attachmentPreviewImage.src = "";

    attachmentPreview.classList.remove(
        "visible"
    );


    /*
       Reset placeholder.
    */

    input.placeholder =
        "Speak to Dalbayob...";


    /*
       Restore welcome screen.
    */

    chatInner.innerHTML = `

        <div
            class="welcome"
            id="welcome">

            <div class="welcome-emblem">

                <div class="crescent">
                    ☪
                </div>

            </div>

            <h1>
                Welcome to Dalbayob.
            </h1>

            <p>
                Intelligence with a slightly questionable pest problem.
            </p>

            <div class="roach-gallery">

                <img
                    src="https://avatars.fastly.steamstatic.com/b76a2e69616ae68a574fdc638ab82fdcc3f94161_full.jpg"
                    alt="Dalbayob specimen"
                >

                <div class="roach-gallery-caption">
                    DALBAYOB SPECIMEN ARCHIVE · ROACH DIVISION
                </div>

            </div>

            <div class="suggestions">

                <button
                    class="suggestion"
                    type="button"
                    onclick="useSuggestion('What can you do?')">

                    What can you do?

                </button>

                <button
                    class="suggestion"
                    type="button"
                    onclick="useSuggestion('Explain something complicated')">

                    Explain something complicated

                </button>

                <button
                    class="suggestion"
                    type="button"
                    onclick="useSuggestion('Give me a creative idea')">

                    Give me a creative idea

                </button>

                <button
                    class="suggestion"
                    type="button"
                    onclick="useSuggestion('Generate an image of a giant cockroach')">

                    🪳 Summon a roach

                </button>

            </div>

        </div>

    `;


    input.focus();

}


/* =========================================================
   SUGGESTION
========================================================= */

function useSuggestion(text) {

    input.value =
        text;

    input.dispatchEvent(
        new Event("input")
    );

    input.focus();

}


/* =========================================================
   IMAGE MODE
========================================================= */

function focusImageMode() {

    input.value =
        currentImage
            ? "Edit the latest image: "
            : attachedImage
                ? "Edit this image: "
                : "Generate an image of ";


    input.dispatchEvent(
        new Event("input")
    );

    input.focus();

}

</script>

</body>
</html>
