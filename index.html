<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dalbayob AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
    --black: #050604;
    --black2: #090d08;
    --green: #102719;
    --green2: #193722;
    --green3: #284b31;
    --gold: #cda957;
    --gold-light: #f0d78c;
    --cream: #eee8d6;
    --muted: #858b7e;
    --roach-brown: #5b301b;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    font-family: Inter, sans-serif;
    color: var(--cream);
    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(39, 86, 48, .24),
            transparent 42%
        ),
        radial-gradient(
            circle at 15% 90%,
            rgba(205, 169, 87, .08),
            transparent 30%
        ),
        var(--black);
}

/* =========================================================
   BACKGROUND
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .16;
    background-image:
        linear-gradient(
            30deg,
            rgba(205,169,87,.15) 1px,
            transparent 1px
        ),
        linear-gradient(
            150deg,
            rgba(205,169,87,.15) 1px,
            transparent 1px
        );
    background-size: 72px 72px;
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 180px rgba(0,0,0,.9);
    z-index: 9999;
}

/* =========================================================
   REAL COCKROACHES
========================================================= */

.real-roach {
    position: fixed;
    width: 190px;
    height: 190px;
    pointer-events: none;

    z-index: 50;

    filter:
        drop-shadow(0 18px 15px rgba(0,0,0,.78))
        saturate(1.08)
        contrast(1.05);
}

.real-roach img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
}

/* Giant top crawler */

.rr1 {
    left: -240px;
    top: 8%;
    width: 210px;
    height: 210px;
    animation: crawlAcross 25s linear infinite;
}

/* Large reverse crawler */

.rr2 {
    right: -250px;
    top: 30%;
    width: 235px;
    height: 235px;
    transform: scaleX(-1);
    animation: crawlReverse 30s linear infinite;
}

/* Vertical crawler */

.rr3 {
    left: 12%;
    top: -230px;
    width: 180px;
    height: 180px;
    transform: rotate(82deg);
    animation: crawlDown 22s linear infinite;
}

/* Bottom monster */

.rr4 {
    right: 4%;
    bottom: -280px;
    width: 270px;
    height: 270px;
    transform: rotate(-58deg);
    animation: crawlUp 27s linear infinite;
}

/* Fast little bastard */

.rr5 {
    left: -180px;
    top: 75%;
    width: 150px;
    height: 150px;
    animation: crawlFast 18s linear infinite;
}

/* Header crawler */

.rr6 {
    right: -230px;
    top: 11%;
    width: 220px;
    height: 220px;
    transform: rotate(180deg);
    animation: crawlHeader 34s linear infinite;
}

/* Falling crawler */

.rr7 {
    left: 53%;
    top: -210px;
    width: 165px;
    height: 165px;
    transform: rotate(110deg);
    animation: crawlDrop 36s linear infinite;
}

/* Another side crawler */

.rr8 {
    left: -210px;
    top: 45%;
    width: 175px;
    height: 175px;
    animation: crawlSide 39s linear infinite;
}

/* =========================================================
   ROACH ANIMATIONS
========================================================= */

@keyframes crawlAcross {

    0% {
        left: -250px;
        top: 8%;
        transform: rotate(-10deg);
    }

    20% {
        top: 13%;
        transform: rotate(5deg);
    }

    40% {
        top: 6%;
        transform: rotate(-4deg);
    }

    60% {
        top: 15%;
        transform: rotate(7deg);
    }

    80% {
        top: 8%;
    }

    100% {
        left: calc(100% + 250px);
        top: 12%;
        transform: rotate(-10deg);
    }
}

@keyframes crawlReverse {

    0% {
        right: -260px;
        top: 30%;
        transform: scaleX(-1) rotate(-12deg);
    }

    25% {
        top: 24%;
    }

    50% {
        top: 35%;
    }

    75% {
        top: 27%;
    }

    100% {
        right: calc(100% + 260px);
        top: 32%;
        transform: scaleX(-1) rotate(-12deg);
    }
}

@keyframes crawlDown {

    0% {
        top: -230px;
        left: 12%;
    }

    25% {
        left: 17%;
    }

    50% {
        left: 10%;
    }

    75% {
        left: 15%;
    }

    100% {
        top: calc(100% + 230px);
        left: 8%;
    }
}

@keyframes crawlUp {

    0% {
        bottom: -290px;
        right: 4%;
    }

    25% {
        right: 10%;
    }

    50% {
        right: 3%;
    }

    75% {
        right: 13%;
    }

    100% {
        bottom: calc(100% + 290px);
        right: 7%;
    }
}

@keyframes crawlFast {

    0% {
        left: -190px;
        top: 75%;
    }

    20% {
        top: 69%;
    }

    40% {
        top: 79%;
    }

    60% {
        top: 71%;
    }

    80% {
        top: 78%;
    }

    100% {
        left: calc(100% + 190px);
        top: 73%;
    }
}

@keyframes crawlHeader {

    0% {
        right: -240px;
        top: 11%;
        transform: rotate(180deg);
    }

    25% {
        top: 17%;
    }

    50% {
        top: 8%;
    }

    75% {
        top: 15%;
    }

    100% {
        right: calc(100% + 240px);
        top: 11%;
        transform: rotate(180deg);
    }
}

@keyframes crawlDrop {

    0% {
        top: -220px;
        left: 53%;
    }

    30% {
        left: 59%;
    }

    65% {
        left: 48%;
    }

    100% {
        top: calc(100% + 220px);
        left: 54%;
    }
}

@keyframes crawlSide {

    0% {
        left: -220px;
        top: 45%;
    }

    30% {
        top: 39%;
    }

    60% {
        top: 51%;
    }

    100% {
        left: calc(100% + 220px);
        top: 44%;
    }
}

/* =========================================================
   APP
========================================================= */

.app {
    position: relative;
    z-index: 100;
    display: flex;
    width: 100%;
    height: 100vh;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    position: relative;
    z-index: 300;

    width: 86px;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 20px 0;

    background: rgba(5,8,5,.9);
    border-right: 1px solid rgba(205,169,87,.18);

    backdrop-filter: blur(20px);
}

.brand-mark {
    width: 50px;
    height: 50px;

    display: grid;
    place-items: center;

    border-radius: 16px;
    border: 1px solid rgba(205,169,87,.5);

    color: var(--gold-light);
    font-size: 25px;

    box-shadow:
        0 0 30px rgba(205,169,87,.08);

    margin-bottom: 45px;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.nav button {
    width: 48px;
    height: 48px;

    border-radius: 14px;

    border: 1px solid rgba(205,169,87,.14);

    background: rgba(255,255,255,.025);

    color: #8d927f;
    font-size: 20px;

    cursor: pointer;

    transition:
        transform .2s,
        color .2s,
        border-color .2s,
        background .2s;
}

.nav button:hover,
.nav button.active {
    color: var(--gold-light);
    border-color: rgba(205,169,87,.5);
    background: rgba(205,169,87,.08);
    transform: translateY(-2px);
}

.sidebar-bottom {
    margin-top: auto;

    writing-mode: vertical-rl;

    color: #555c51;

    font-size: 9px;
    letter-spacing: 4px;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: relative;
    z-index: 300;

    height: 78px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 32px;

    background: rgba(4,7,4,.78);

    border-bottom: 1px solid rgba(205,169,87,.12);

    backdrop-filter: blur(20px);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.header-symbol {
    color: var(--gold-light);
    font-size: 25px;
}

.header-title {
    font-family: Cinzel, serif;

    font-size: 16px;
    letter-spacing: 4px;
}

.header-sub {
    margin-top: 3px;

    color: #666d61;

    font-size: 9px;
    letter-spacing: 2px;
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;

    color: #7f8979;

    font-size: 9px;
    letter-spacing: 2px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #a8c174;

    box-shadow:
        0 0 12px #a8c174;
}

/* =========================================================
   CHAT
========================================================= */

#chat {
    position: relative;
    z-index: 120;

    flex: 1;

    overflow-y: auto;

    scrollbar-width: thin;
    scrollbar-color: #354332 transparent;
}

.chat-inner {
    width: min(1050px, 100%);

    min-height: 100%;

    margin: auto;

    padding: 50px 35px 190px;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome {
    min-height: 60vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.welcome-emblem {
    width: 105px;
    height: 105px;

    display: grid;
    place-items: center;

    margin-bottom: 25px;

    border-radius: 50%;

    border: 1px solid rgba(205,169,87,.42);

    background:
        radial-gradient(
            circle,
            rgba(205,169,87,.1),
            transparent 68%
        );

    box-shadow:
        0 0 60px rgba(205,169,87,.07),
        inset 0 0 30px rgba(205,169,87,.04);
}

.crescent {
    color: var(--gold-light);
    font-size: 50px;
}

.welcome h1 {
    margin: 0;

    font-family: Cinzel, serif;

    font-size: clamp(28px, 4vw, 48px);

    font-weight: 600;

    letter-spacing: 1px;
}

.welcome > p {
    margin-top: 12px;

    color: #858b7e;

    font-size: 14px;
}

/* =========================================================
   SPECIMEN IMAGE
========================================================= */

.roach-gallery {
    position: relative;

    width: min(390px, 90%);

    margin: 25px auto 5px;
}

.roach-gallery::before {
    content: "SPECIMEN // 001";

    position: absolute;

    left: 17px;
    top: -12px;

    z-index: 5;

    padding: 4px 8px;

    color: var(--gold-light);

    background: var(--black);

    font-size: 8px;
    letter-spacing: 3px;
}

.roach-gallery img {
    width: 100%;

    display: block;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    border-radius: 20px;

    border: 1px solid rgba(205,169,87,.35);

    box-shadow:
        0 20px 70px rgba(0,0,0,.7),
        0 0 35px rgba(205,169,87,.07);

    filter:
        saturate(.88)
        contrast(1.06);
}

.roach-gallery-caption {
    position: absolute;

    left: 14px;
    right: 14px;
    bottom: 14px;

    padding: 12px 14px;

    border-radius: 12px;

    background: rgba(3,5,3,.82);

    border: 1px solid rgba(205,169,87,.18);

    backdrop-filter: blur(12px);

    color: #b9b5a1;

    text-align: left;

    font-size: 9px;
    letter-spacing: 2px;
}

/* =========================================================
   SUGGESTIONS
========================================================= */

.suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;

    gap: 9px;

    max-width: 700px;

    margin-top: 27px;
}

.suggestion {
    padding: 10px 16px;

    border-radius: 100px;

    border: 1px solid rgba(205,169,87,.16);

    background: rgba(255,255,255,.025);

    color: #aaa99a;

    font-family: Inter, sans-serif;
    font-size: 11px;

    cursor: pointer;

    transition: .2s;
}

.suggestion:hover {
    color: var(--gold-light);

    border-color: rgba(205,169,87,.45);

    background: rgba(205,169,87,.07);

    transform: translateY(-1px);
}

/* =========================================================
   MESSAGES
========================================================= */

.message-row {
    display: flex;

    margin: 22px 0;
}

.message-row.user {
    justify-content: flex-end;
}

.message {
    max-width: 78%;

    padding: 15px 18px;

    border-radius: 17px;

    line-height: 1.65;

    font-size: 14px;

    white-space: pre-wrap;
}

.message.user {
    color: #e7eadc;

    background:
        linear-gradient(
            135deg,
            #183522,
            #102417
        );

    border: 1px solid rgba(111,160,110,.18);

    border-bottom-right-radius: 5px;
}

.message.assistant {
    color: #d3d2c5;

    background: rgba(255,255,255,.025);

    border: 1px solid rgba(205,169,87,.12);

    border-left: 2px solid rgba(205,169,87,.6);

    border-bottom-left-radius: 5px;
}

.message.assistant img {
    max-width: 100%;
    display: block;

    border-radius: 14px;

    border: 1px solid rgba(205,169,87,.3);
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 400;

    padding: 20px 28px 23px;

    background:
        linear-gradient(
            to top,
            rgba(5,6,4,1) 40%,
            rgba(5,6,4,.88),
            transparent
        );
}

.composer {
    width: min(900px, 100%);

    min-height: 62px;

    margin: auto;

    display: flex;
    align-items: flex-end;

    gap: 9px;

    padding: 8px;

    border-radius: 19px;

    border: 1px solid rgba(205,169,87,.18);

    background: rgba(11,16,11,.92);

    backdrop-filter: blur(22px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.5),
        inset 0 0 25px rgba(205,169,87,.015);
}

.tool {
    width: 46px;
    height: 46px;

    flex: 0 0 46px;

    border-radius: 13px;

    border: 1px solid rgba(205,169,87,.13);

    background: rgba(255,255,255,.025);

    color: #929888;

    font-size: 20px;

    cursor: pointer;

    transition: .2s;
}

.tool:hover {
    color: var(--gold-light);

    border-color: rgba(205,169,87,.4);

    background: rgba(205,169,87,.06);
}

.tool.image {
    font-size: 21px;
}

.tool.send {
    color: #10130d;

    background: var(--gold);

    border-color: var(--gold);

    font-weight: 800;
}

.tool.send:hover {
    background: var(--gold-light);

    transform: translateY(-2px);
}

textarea {
    flex: 1;

    min-height: 46px;
    max-height: 150px;

    padding: 13px 4px;

    resize: none;

    border: 0;
    outline: 0;

    background: transparent;

    color: #eee;

    font-family: Inter, sans-serif;
    font-size: 14px;
}

textarea::placeholder {
    color: #62685e;
}

.note {
    margin-top: 9px;

    color: #555a51;

    text-align: center;

    font-size: 9px;
    letter-spacing: .5px;
}

/* =========================================================
   SCROLLBAR
========================================================= */

#chat::-webkit-scrollbar {
    width: 7px;
}

#chat::-webkit-scrollbar-track {
    background: transparent;
}

#chat::-webkit-scrollbar-thumb {
    background: #263126;
    border-radius: 20px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .sidebar {
        width: 58px;
    }

    .brand-mark {
        width: 40px;
        height: 40px;

        margin-bottom: 25px;

        font-size: 19px;

        border-radius: 12px;
    }

    .nav button {
        width: 38px;
        height: 38px;

        font-size: 17px;
    }

    .header {
        padding: 0 16px;
    }

    .header-sub,
    .status {
        display: none;
    }

    .chat-inner {
        padding: 30px 16px 165px;
    }

    .message {
        max-width: 90%;
    }

    .composer-area {
        padding: 12px;
    }

    .tool {
        width: 40px;
        height: 40px;

        flex-basis: 40px;
    }

    .composer {
        min-height: 56px;
    }

    .real-roach {
        width: 125px;
        height: 125px;
    }

    .rr2,
    .rr4,
    .rr6,
    .rr8 {
        display: none;
    }

    .roach-gallery {
        width: min(330px, 90%);
    }
}
</style>
</head>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const chatInner = document.getElementById("chat-inner");

/*
   IMAGE MEMORY

   This stores the latest image generated by Dalbayob.

   Example:

   First prompt:
   "Create a fox driving a Mercedes"

   currentImage becomes that image.

   Next prompt:
   "Make the Mercedes black"

   The previous image is sent to /api/image
   together with the new instruction.
*/
let currentImage = null;


/* =========================================================
   TEXTAREA AUTO RESIZE
========================================================= */

input.addEventListener("input", () => {

    input.style.height = "auto";

    input.style.height =
        Math.min(input.scrollHeight, 150) + "px";

});


/* =========================================================
   ENTER TO SEND
========================================================= */

input.addEventListener("keydown", event => {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

});


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(text, type) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const row =
        document.createElement("div");

    row.className =
        "message-row " + type;

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    row.appendChild(message);

    chatInner.appendChild(row);

    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight;

    });

    return message;
}


/* =========================================================
   CHAT
========================================================= */

async function sendMessage() {

    const text =
        input.value.trim();

    if (!text)
        return;

    addMessage(
        text,
        "user"
    );

    input.value = "";

    input.style.height =
        "auto";

    const reply =
        addMessage(
            "Thinking...",
            "assistant"
        );

    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "AI request failed."
            );

        }

        reply.textContent =
            data.reply;

    } catch (error) {

        reply.textContent =
            "⚠️ " + error.message;

    }

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   IMAGE GENERATION + IMAGE EDITING
========================================================= */

async function generateImage() {

    const prompt =
        input.value.trim();

    if (!prompt) {

        input.focus();

        return;
    }


    /*
       Add user's instruction to chat.
    */

    addMessage(
        "☪ " + prompt,
        "user"
    );


    input.value = "";

    input.style.height =
        "auto";


    /*
       If an image already exists,
       Dalbayob is editing it.

       Otherwise it generates a new image.
    */

    const statusText =
        currentImage
            ? "✏️ Editing the latest specimen..."
            : "🪳 Generating specimen...";


    const message =
        addMessage(
            statusText,
            "assistant"
        );


    try {

        const response =
            await fetch(
                "/api/image",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        /*
                           New instruction
                        */
                        prompt: prompt,


                        /*
                           Latest generated image

                           If this is null:
                           Generate a new image.

                           If this contains an image:
                           Edit that image.
                        */
                        image: currentImage

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Image generation failed."
            );

        }


        /*
           IMPORTANT:

           Save the newly generated/edited image.

           This means the NEXT edit uses
           this newest version.
        */

        currentImage =
            data.image;


        /*
           Remove loading text.
        */

        message.textContent = "";


        /*
           Create image element.
        */

        const image =
            document.createElement("img");


        image.src =
            currentImage;


        image.alt =
            prompt;


        /*
           Add image to chat.
        */

        message.appendChild(image);


    } catch (error) {

        message.textContent =
            "⚠️ " + error.message;

    }


    chat.scrollTop =
        chat.scrollHeight;
}

   NEW CHAT
========================================================= */
