```html
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dalbayob AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

:root {
    --bg: #05070b;
    --panel: rgba(10, 14, 19, .72);
    --panel-solid: #0a0e13;
    --border: rgba(255,255,255,.075);
    --text: #f4f7f5;
    --muted: #87918e;
    --green: #72f6c1;
    --cyan: #63d9ff;
    --purple: #9c8cff;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
}

.aurora {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 115%,
            rgba(29, 110, 83, .18),
            transparent 55%
        ),
        radial-gradient(
            ellipse at 10% 20%,
            rgba(17, 53, 45, .18),
            transparent 45%
        ),
        #05070b;
}

.aurora::before,
.aurora::after {
    content: "";
    position: absolute;
    width: 75vw;
    height: 65vh;
    left: 18%;
    top: -18%;
    border-radius: 50%;
    filter: blur(65px);
    opacity: .42;
    transform: rotate(-13deg);
}

.aurora::before {
    background:
        linear-gradient(
            105deg,
            transparent 0%,
            rgba(77,255,191,.02) 18%,
            rgba(74,239,178,.32) 37%,
            rgba(74,214,255,.2) 51%,
            rgba(131,104,255,.2) 67%,
            transparent 85%
        );
    animation: auroraOne 16s ease-in-out infinite alternate;
}

.aurora::after {
    left: 35%;
    top: -10%;
    opacity: .25;
    background:
        linear-gradient(
            110deg,
            transparent 10%,
            rgba(64,255,194,.3) 35%,
            rgba(89,177,255,.2) 50%,
            transparent 78%
        );
    animation: auroraTwo 21s ease-in-out infinite alternate;
}

@keyframes auroraOne {
    from {
        transform: translateX(-8%) rotate(-13deg) scale(1);
    }
    to {
        transform: translateX(9%) rotate(-7deg) scale(1.15);
    }
}

@keyframes auroraTwo {
    from {
        transform: translateX(8%) rotate(12deg) scale(1);
    }
    to {
        transform: translateX(-10%) rotate(5deg) scale(1.12);
    }
}

.stars {
    position: absolute;
    inset: 0;
    opacity: .35;
    background-image:
        radial-gradient(circle, rgba(255,255,255,.65) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.4) 1px, transparent 1px);
    background-size: 127px 127px, 211px 211px;
    background-position: 20px 30px, 80px 90px;
}

.app {
    position: relative;
    z-index: 2;
    display: flex;
    width: 100%;
    height: 100vh;
}

.sidebar {
    width: 265px;
    flex-shrink: 0;
    padding: 18px;
    display: flex;
    flex-direction: column;
    background: rgba(5, 8, 11, .62);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border-right: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 5px 7px 24px;
}

.brand-mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    color: #07110d;
    font-size: 17px;
    font-weight: 700;
    background: linear-gradient(
        135deg,
        #b6ffe3,
        #6ff2c0 55%,
        #65d7ff
    );
    box-shadow:
        0 0 25px rgba(91, 240, 188, .2);
}

.brand-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -.3px;
}

.brand-name span {
    color: #8c9693;
    font-weight: 500;
}

.new-chat {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 11px;
    color: #e7ecea;
    background: rgba(255,255,255,.035);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: .2s ease;
}

.new-chat:hover {
    background: rgba(255,255,255,.065);
    border-color: rgba(255,255,255,.12);
}

.new-icon {
    color: var(--green);
    font-size: 17px;
}

.sidebar-label {
    margin: 28px 8px 10px;
    color: #59625f;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.3px;
    text-transform: uppercase;
}

.sidebar-bottom {
    margin-top: auto;
    padding: 12px 8px;
    color: #59625f;
    font-size: 10px;
}

.main {
    position: relative;
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.header {
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 27px;
    background: rgba(5,8,11,.32);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
}

.header-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.header-name {
    font-size: 14px;
    font-weight: 600;
}

.online {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #75807b;
    font-size: 11px;
}

.online-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px rgba(114,246,193,.8);
}

#chat {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
    padding: 30px 24px 155px;
}

#chat::-webkit-scrollbar {
    width: 5px;
}

#chat::-webkit-scrollbar-track {
    background: transparent;
}

#chat::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.09);
    border-radius: 10px;
}

.chat-inner {
    width: min(820px, 100%);
    margin: auto;
}

.welcome {
    margin-top: 15vh;
    text-align: center;
    animation: welcomeIn .6s ease;
}

@keyframes welcomeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.welcome-mark {
    width: 58px;
    height: 58px;
    margin: 0 auto 23px;
    display: grid;
    place-items: center;
    border-radius: 17px;
    color: #b9ffe5;
    font-size: 22px;
    background: rgba(104,239,190,.07);
    border: 1px solid rgba(111,242,192,.14);
    box-shadow:
        0 0 45px rgba(91,240,188,.08),
        inset 0 0 25px rgba(91,240,188,.035);
}

.welcome h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1.1;
    letter-spacing: -1.6px;
    font-weight: 700;
}

.welcome p {
    margin: 13px 0 0;
    color: #727c78;
    font-size: 13px;
}

.message-row {
    display: flex;
    margin: 25px 0;
    animation: messageIn .2s ease-out;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message-row.user {
    justify-content: flex-end;
}

.message {
    max-width: 76%;
    padding: 13px 16px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
}

.message.user {
    color: #f7faf8;
    background: rgba(104, 119, 113, .18);
    border: 1px solid rgba(255,255,255,.07);
}

.message.assistant {
    color: #dfe6e3;
    background: rgba(7,10,13,.58);
    border: 1px solid rgba(255,255,255,.055);
    backdrop-filter: blur(15px);
}

.composer-area {
    position: absolute;
    z-index: 10;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 20px 24px 21px;
    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(5,7,10,.82) 35%,
            rgba(5,7,10,.96)
        );
}

.composer {
    width: min(820px, 100%);
    min-height: 58px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 5px;
    padding: 7px;
    border: 1px solid rgba(255,255,255,.095);
    border-radius: 16px;
    background: rgba(10,14,18,.78);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow:
        0 20px 55px rgba(0,0,0,.35),
        0 0 45px rgba(80,210,165,.025);
    transition: border-color .2s ease, box-shadow .2s ease;
}

.composer:focus-within {
    border-color: rgba(114,246,193,.2);
    box-shadow:
        0 20px 55px rgba(0,0,0,.4),
        0 0 45px rgba(80,210,165,.06);
}

textarea {
    flex: 1;
    min-width: 0;
    min-height: 43px;
    max-height: 150px;
    resize: none;
    outline: none;
    border: none;
    padding: 12px 9px;
    color: #eef3f0;
    background: transparent;
    font: inherit;
    font-size: 13px;
    line-height: 19px;
}

textarea::placeholder {
    color: #59625f;
}

.tool {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 11px;
    color: #78817e;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
    transition: .18s ease;
}

.tool:hover {
    color: #dce5e1;
    background: rgba(255,255,255,.055);
}

.send {
    color: #06100b;
    background: #e8f4ef;
    font-size: 19px;
    font-weight: 700;
}

.send:hover {
    color: #06100b;
    background: #ffffff;
    transform: translateY(-1px);
}

.note {
    width: min(820px, 100%);
    margin: 8px auto 0;
    color: #454d4a;
    text-align: center;
    font-size: 9px;
}

@media (max-width: 720px) {

    .sidebar {
        display: none;
    }

    .header {
        height: 58px;
        padding: 0 17px;
    }

    #chat {
        padding: 25px 13px 145px;
    }

    .composer-area {
        padding: 14px 10px 15px;
    }

    .welcome {
        margin-top: 16vh;
    }

    .welcome h1 {
        font-size: 29px;
    }

    .message {
        max-width: 90%;
    }

    .tool {
        width: 39px;
        height: 39px;
    }

    textarea {
        min-height: 39px;
    }

    .composer {
        min-height: 53px;
        border-radius: 15px;
    }
}
</style>

</head>

<body>

<div class="aurora">
    <div class="stars"></div>
</div>

<div class="app">

<aside class="sidebar">

    <div class="brand">
        <div class="brand-mark">✦</div>
        <div class="brand-name">
            Dalbayob <span>AI</span>
        </div>
    </div>

    <button class="new-chat" onclick="newChat()">
        <span class="new-icon">＋</span>
        New conversation
    </button>

    <div class="sidebar-label">
        Conversations
    </div>

    <div class="sidebar-bottom">
        Dalbayob AI
    </div>

</aside>

<main class="main">

    <header class="header">
        <div class="header-info">
            <div class="header-name">
                Dalbayob AI
            </div>

            <div class="online">
                <span class="online-dot"></span>
                Online
            </div>
        </div>
    </header>

    <section id="chat">

        <div class="chat-inner" id="chat-inner">

            <div class="welcome" id="welcome">

                <div class="welcome-mark">
                    ✦
                </div>

                <h1>
                    What can I help you with?
                </h1>

                <p>
                    Ask Dalbayob AI anything.
                </p>

            </div>

        </div>

    </section>

    <div class="composer-area">

        <div class="composer">

            <button
                class="tool"
                title="Attach file"
                type="button"
            >
                ＋
            </button>

            <textarea
                id="input"
                rows="1"
                placeholder="Message Dalbayob AI..."
            ></textarea>

            <!-- IMAGE GENERATION BUTTON -->
            <button
                class="tool"
                title="Generate image"
                type="button"
                onclick="generateImage()"
            >
                ◇
            </button>

            <button
                class="tool send"
                onclick="sendMessage()"
                title="Send"
                type="button"
            >
                ↑
            </button>

        </div>

        <div class="note">
            Dalbayob AI can make mistakes. Check important information.
        </div>

    </div>

</main>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const chatInner = document.getElementById("chat-inner");

input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height =
        Math.min(input.scrollHeight, 150) + "px";
});

input.addEventListener("keydown", event => {

    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }

});

function addMessage(text, type) {

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const row = document.createElement("div");
    row.className = "message-row " + type;

    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;

    row.appendChild(message);
    chatInner.appendChild(row);

    requestAnimationFrame(() => {
        chat.scrollTop = chat.scrollHeight;
    });

    return message;
}

async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";
    input.style.height = "auto";

    const reply = addMessage("Thinking...", "assistant");

    try {

        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "AI request failed."
            );
        }

        reply.textContent = data.reply;

    } catch (error) {

        reply.textContent =
            "⚠️ " + error.message;

    }

    chat.scrollTop = chat.scrollHeight;
}


/* =========================
   IMAGE GENERATION
========================= */

async function generateImage() {

    const prompt = input.value.trim();

    if (!prompt) {
        input.focus();
        return;
    }

    addMessage(prompt, "user");

    input.value = "";
    input.style.height = "auto";

    const message = addMessage(
        "🎨 Generating image...",
        "assistant"
    );

    try {

        const response = await fetch("/api/image", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                prompt: prompt
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Image generation failed."
            );
        }

        message.textContent = "";

        const image = document.createElement("img");

        image.src = data.image;
        image.alt = prompt;

        image.style.maxWidth = "100%";
        image.style.borderRadius = "12px";
        image.style.display = "block";

        message.appendChild(image);

    } catch (error) {

        message.textContent =
            "⚠️ " + error.message;

    }

    chat.scrollTop = chat.scrollHeight;
}


function newChat() {

    chatInner.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="welcome-mark">✦</div>
            <h1>What can I help you with?</h1>
            <p>Ask Dalbayob AI anything.</p>
        </div>
    `;

    input.focus();
}

</script>

</body>
</html>
